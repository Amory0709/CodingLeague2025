<header class="header">
  <div class="header-container">
    <!-- 左侧Logo和标题 -->
    <div class="header-left">
      <div class="logo-section">
        <img src="../../assets/logo.png" alt="Coding League" class="logo" />
        <h1 class="brand-title">Coding League</h1>
      </div>
    </div>
    
    <!-- 右侧用户信息 -->
    <div class="header-right">
      <div class="user-profile">
        <div class="user-info">
          <span class="user-name">
            {{ isLoggedIn ? (userInfo?.name || 'User') : anonymousUser.name }}
          </span>
          <span class="user-status">
            {{ isLoggedIn ? 'Registered' : 'Guest' }}
          </span>
        </div>
        <div class="user-avatar">
          <img [src]="isLoggedIn ? (userInfo?.avatar || anonymousUser.avatar) : anonymousUser.avatar" 
               alt="User Avatar" 
               class="avatar-img" />
        </div>
      </div>
    </div>
  </div>
</header>
