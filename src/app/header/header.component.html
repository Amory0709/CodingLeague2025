<header class="header">
  <div class="header-container">
    <!-- 左侧Logo和标题 -->
    <div class="header-left">
      <div class="logo-section" routerLink="/" title="Home">
        <img src="../../assets/logo.png" alt="Coding League" class="logo" />
        <h1 class="brand-title">Coding League</h1>
      </div>
    </div>
    
    <!-- 右侧用户信息 -->
    <div class="header-right">
      <div class="user-profile" routerLink="/profile" title="User Profile">
        <div class="user-info">
          <span class="user-name">
            {{ displayName }}
          </span>
          <span class="user-status">
            {{ userStatus }}
          </span>
        </div>
        <div class="user-avatar">
          <img [src]="displayAvatar" 
               alt="User Avatar" 
               class="avatar-img" />
        </div>
      </div>
    </div>
  </div>
</header>
