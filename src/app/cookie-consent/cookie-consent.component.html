<div class="cookie-consent" *ngIf="showConsent" role="dialog" aria-labelledby="cookie-title" aria-describedby="cookie-description">
  <div class="cookie-content">
    <div class="cookie-info">
      <div class="cookie-icon" aria-hidden="true">🍪</div>
      <div class="cookie-text">
        <p id="cookie-description" class="cookie-description">
          We use cookies to enhance your experience. 
          <a href="#" class="cookie-link">Learn more</a>
        </p>
      </div>
    </div>
    
    <div class="cookie-actions">
      <button type="button" 
              class="btn btn-secondary" 
              (click)="declineCookies()"
              aria-label="Decline non-essential cookies">
        Decline
      </button>
      <button type="button" 
              class="btn btn-primary" 
              (click)="acceptCookies()"
              aria-label="Accept all cookies">
        Accept All
      </button>
    </div>
  </div>
</div>
