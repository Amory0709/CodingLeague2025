<div class="main">
  <div class="profile-container">
    <h2 class="title">Edit Information</h2>
    
    <form class="profile-form" (ngSubmit)="onSave()">
      <!-- 头像上传区域 -->
      <div class="avatar-section">
        <div class="avatar-preview">
          <img [src]="avatarUrl || 'assets/default-avatar.svg'" alt="Avatar" class="avatar-img" />
        </div>
        <div class="avatar-actions">
          <button type="button" class="btn btn-upload" (click)="fileInput.click()">
            Edit Photo
          </button>
          <input 
            #fileInput
            type="file" 
            accept="image/*" 
            (change)="onFileSelected($event)" 
            style="display: none;" />
          <p class="avatar-info">Upload a photo or use the default avatar</p>
        </div>
      </div>
      
      <!-- 个人信息区域 -->
      <div class="personal-info">
        <h3>Personal Information</h3>
        
        <div class="form-group">
          <label for="title">Title</label>
          <select 
            id="title" 
            name="title" 
            class="form-input"
            [(ngModel)]="form.title">
            <option value="">Select a title</option>
            <option *ngFor="let option of titleOptions" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            class="form-input" 
            [(ngModel)]="form.name"
            placeholder="Enter your full name" 
            required />
        </div>
        
        <div class="form-group">
          <label for="address">Address</label>
          <input 
            type="text" 
            id="address" 
            name="address" 
            class="form-input" 
            [(ngModel)]="form.address"
            placeholder="Enter your address" />
        </div>
        
        <div class="form-group">
          <label>Date of Birth</label>
          <div class="birthday-inputs">
            <select 
              name="birthMonth" 
              class="form-input birthday-field"
              [(ngModel)]="form.birthMonth">
              <option value="">Month</option>
              <option *ngFor="let month of months" [value]="month.value">
                {{ month.label }}
              </option>
            </select>
            
            <select 
              name="birthDay" 
              class="form-input birthday-field"
              [(ngModel)]="form.birthDay">
              <option value="">Day</option>
              <option *ngFor="let day of days" [value]="day">
                {{ day }}
              </option>
            </select>
            
            <select 
              name="birthYear" 
              class="form-input birthday-field"
              [(ngModel)]="form.birthYear">
              <option value="">Year</option>
              <option *ngFor="let year of years" [value]="year">
                {{ year }}
              </option>
            </select>
          </div>
          <p class="birthday-info">We use this information to provide age-appropriate content and features</p>
        </div>
      </div>
      
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" (click)="onCancel()">
          Cancel
        </button>
        <button type="submit" class="btn btn-save">
          Continue
        </button>
      </div>
    </form>
  </div>
</div>
