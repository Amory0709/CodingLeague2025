<div class="main">
  <div class="interests-container">
    <!-- 固定顶部操作栏 -->
    <div class="sticky-header">
      <!-- 进度条 - 2/3 -->
      <div class="progress-bar">
        <div class="progress-bar-inner" style="width: 66.67%"></div>
      </div>
      
      <div class="header-row">
        <button class="back-btn" (click)="goBack()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Back
        </button>
        
        <div class="action-buttons">
          <button class="btn btn-skip" (click)="onSkip()">
            Skip this step
          </button>
          <button 
            class="btn btn-explore" 
            [disabled]="!canProceed()" 
            (click)="onStartExploring()">
            Start Exploring
          </button>
        </div>
      </div>
      
      <h2 class="title">Tell us what you like?</h2>
      
      <div class="control-row">
        <div class="bulk-actions">
          <button class="bulk-btn" (click)="selectAll()">Select All</button>
          <button class="bulk-btn" (click)="unselectAll()">Unselect All</button>
        </div>
        
        <div class="selection-count">
          Selected {{ selectedCount }} interests
          <span class="min-requirement" [class.met]="canProceed()">
            (min. 3 required)
          </span>
        </div>
      </div>
    </div>

    <!-- 滚动内容区域 -->
    <div class="scroll-content">
      <div class="categories-container">
        <div *ngFor="let category of interestCategories" class="category-section">
          <h3 class="category-title">{{ category.name }}</h3>
          <div class="interests-grid">
            <div 
              *ngFor="let interest of category.interests" 
              class="interest-card"
              [class.selected]="isSelected(interest.id)"
              (click)="toggleInterest(interest.id)"
              [style.--card-color]="interest.color">
              
              <div class="interest-icon">{{ interest.icon }}</div>
              <div class="interest-name">{{ interest.name }}</div>
              
              <div class="selection-indicator" *ngIf="isSelected(interest.id)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="currentColor"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
