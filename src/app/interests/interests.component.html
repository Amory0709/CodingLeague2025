<form class="interests-form">
  <h2>Select Your Interests</h2>
  <p class="interests-description">Choose at least 3 interests that best describe you</p>
  
  <div class="interests-header">
    <div class="selection-controls">
      <button type="button" class="btn btn-select-all" (click)="selectAll()">
        Select All
      </button>
      <button type="button" class="btn btn-unselect-all" (click)="unselectAll()">
        Unselect All
      </button>
    </div>
    <div class="selection-count">
      Selected: {{ selectedCount }}/{{ allInterests.length }}
    </div>
  </div>

  <div class="interests-grid">
    <label *ngFor="let interest of allInterests" class="interest-item">
      <input type="checkbox"
             [checked]="interests.includes(interest.name)"
             (change)="onInterestChange($event, interest.name)"
             name="interests-{{interest.name}}" />
      <div class="interest-content">
        <span class="interest-icon">{{ interest.icon }}</span>
        <span class="interest-name">{{ interest.name }}</span>
      </div>
    </label>
  </div>

  <div class="interests-actions">
    <button type="button" class="btn btn-cancel" routerLink="/">Cancel</button>
    <button type="button" 
            class="btn btn-next" 
            [class.disabled]="isNextDisabled"
            [disabled]="isNextDisabled"
            (click)="onNext()">
      Next
    </button>
  </div>
</form>
