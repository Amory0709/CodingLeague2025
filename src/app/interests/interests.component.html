<div class="main">
  <div class="interests-container">
    <!-- 页面头部 -->
    <div class="page-header">
      <h2 class="title">Personalize Your Experience</h2>
      <p class="subtitle">Tell us what you like?</p>
      <div class="progress-indicator">
        <span class="progress-text">Step 2 of 2</span>
      </div>
      <button class="skip-btn" (click)="onSkip()">Skip this step</button>
    </div>

    <!-- 兴趣选择区域 -->
    <div class="interests-content">
      <div class="interests-description">
        <p>Select topics that interest you, and we'll provide personalized recommendations</p>
      </div>

      <div class="categories-container">
        <div *ngFor="let category of interestCategories" class="category-section">
          <h3 class="category-title">{{ category.name }}</h3>
          <div class="interests-grid">
            <div 
              *ngFor="let interest of category.interests" 
              class="interest-card"
              [class.selected]="isSelected(interest.id)"
              (click)="toggleInterest(interest.id)"
              [style.--card-color]="interest.color">
              
              <div class="interest-icon">{{ interest.icon }}</div>
              <div class="interest-name">{{ interest.name }}</div>
              
              <div class="selection-indicator" *ngIf="isSelected(interest.id)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="currentColor"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部操作区域 -->
    <div class="bottom-actions">
      <div class="selection-summary">
        <span class="selected-count">Selected {{ selectedCount }} interests</span>
      </div>
      
      <div class="action-buttons">
        <button class="btn btn-skip" (click)="onSkip()">
          Skip
        </button>
        <button class="btn btn-complete" (click)="onComplete()">
          Start Exploring
        </button>
      </div>
    </div>
  </div>
</div>
